name: notify-release
on:
  workflow_dispatch:
  release:
    types: [published]
  schedule:
    - cron: '30 8 * * *'
permissions:
  contents: read
jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Notify release
        uses: nearform-actions/github-action-notify-release@fce55962db73dfecf526b11a2cea2cd2342d62a2 # v2.0.0
        with:
          github-token: ${{ github.token }}
